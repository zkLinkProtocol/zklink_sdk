name: zklink
description: "zkLink Dart SDK"
homepage: "https://zk.link"

version: 0.0.2

environment:
  sdk: '>=3.8.1 <4.0.0'
  flutter: '>=3.32.1'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  flutter_rust_bridge:  ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^19.0.0
  test: ^1.25.15

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
